<!-- Anchor Plumbing Pro — shared header fragment. Fetched into #site-header on every page. -->
<style>
.apx-hdr{--navy:#123B73;--blue:#1769AA;--orange:#F97316;--ink:#0A1F44;--line:#DCE6F1;position:fixed;top:0;left:0;right:0;z-index:100;height:68px;background:#fff;border-bottom:1px solid var(--line);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;box-shadow:0 1px 12px rgba(18,59,115,.06)}
.apx-hdr *,.apx-hdr *::before,.apx-hdr *::after{box-sizing:border-box}
.apx-bar{max-width:1240px;height:100%;margin:0 auto;padding:0 14px;display:flex;align-items:center;gap:10px}
.apx-brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0;color:var(--navy);text-decoration:none}
.apx-brand img{width:44px;height:44px;flex:none;border-radius:10px;object-fit:cover}
.apx-brand span{display:block;font-family:Sora,system-ui,sans-serif;font-weight:800;font-size:.95rem;line-height:1.1;letter-spacing:-.01em}
.apx-brand small{display:block;margin-top:2px;font-family:system-ui,sans-serif;font-weight:600;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:#4B5B70}
.apx-call{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--orange);color:var(--ink);font-weight:800;font-size:.95rem;text-decoration:none;white-space:nowrap;box-shadow:0 4px 14px rgba(249,115,22,.35);transition:background .15s,transform .15s}
.apx-call:hover{background:#EA6A0A}
.apx-call svg{width:18px;height:18px;flex:none}
.apx-call .apx-num{display:none}
.apx-burger{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--navy);cursor:pointer}
.apx-burger span,.apx-burger span::before,.apx-burger span::after{display:block;width:20px;height:2px;background:currentColor;border-radius:2px;content:"";transition:transform .2s,opacity .2s}
.apx-burger span{position:relative}
.apx-burger span::before{position:absolute;top:-6px}
.apx-burger span::after{position:absolute;top:6px}
.apx-burger[aria-expanded="true"] span{background:transparent}
.apx-burger[aria-expanded="true"] span::before{transform:translateY(6px) rotate(45deg)}
.apx-burger[aria-expanded="true"] span::after{transform:translateY(-6px) rotate(-45deg)}
.apx-nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 18px 30px rgba(18,59,115,.12);padding:6px 14px 16px}
.apx-nav.is-open{display:block}
.apx-nav ul{list-style:none;margin:0;padding:0}
.apx-nav li+li{border-top:1px solid #EDF2F8}
.apx-nav a{display:block;padding:14px 4px;color:var(--navy);font-weight:700;text-decoration:none}
.apx-nav a:hover{color:var(--blue)}
.apx-nav a[aria-current="page"]{color:var(--blue);box-shadow:inset 3px 0 0 var(--orange);padding-left:12px}
.apx-hdr a:focus-visible,.apx-hdr button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (min-width:440px){.apx-call .apx-lbl{display:inline}.apx-brand span{font-size:1.05rem}}
@media (min-width:600px){.apx-call .apx-num{display:inline}.apx-bar{padding:0 24px}}
@media (min-width:1080px){
 .apx-burger{display:none}
 .apx-nav{display:block;position:static;border:0;box-shadow:none;padding:0;background:none}
 .apx-nav ul{display:flex;gap:2px}
 .apx-nav li+li{border:0}
 .apx-nav a{padding:10px 12px;border-radius:10px;font-size:.95rem}
 .apx-nav a:hover{background:#F4F8FC}
 .apx-nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--orange);border-radius:10px 10px 0 0;padding-left:12px}
 .apx-bar{gap:22px}
 .apx-brand{margin-right:0}
 .apx-nav{margin-left:auto;order:2}
 .apx-call{order:3}
}
@media (prefers-reduced-motion:reduce){.apx-hdr *{transition:none!important}}
</style>
<header class="apx-hdr" id="apx-header">
 <div class="apx-bar">
  <a class="apx-brand" href="/" aria-label="Anchor Plumbing Pro — San Antonio plumbing, home page">
   <img src="/images/anchor-plumbing-pro-logo.webp" width="44" height="44" alt="Anchor Plumbing Pro logo in navy blue and orange" decoding="async">
   <div><span>Anchor Plumbing Pro</span><small>San Antonio, TX</small></div>
  </a>
  <a class="apx-call" href="tel:+12109444234" aria-label="Call Anchor Plumbing Pro at (210) 944-4234">
   <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
   <span class="apx-lbl">Call</span><span class="apx-num">(210) 944-4234</span>
  </a>
  <button class="apx-burger" type="button" aria-expanded="false" aria-controls="apx-nav" aria-label="Open menu"><span></span></button>
  <nav class="apx-nav" id="apx-nav" aria-label="Main">
   <ul>
    <li><a href="/" data-match="/">Home</a></li>
    <li><a href="/services/" data-match="/services/">Services</a></li>
    <li><a href="/brands/" data-match="/brands/">Brands</a></li>
    <li><a href="/service-areas/" data-match="/service-areas/">Service Areas</a></li>
    <li><a href="/about-anchor-plumbing-pro/" data-match="/about-anchor-plumbing-pro/">About</a></li>
    <li><a href="/contact-anchor-plumbing-pro/" data-match="/contact-anchor-plumbing-pro/">Contact</a></li>
   </ul>
  </nav>
 </div>
</header>
<script>
(function(){
 var root=document.getElementById('apx-header');
 if(!root||root.getAttribute('data-init'))return;
 root.setAttribute('data-init','1');
 var btn=root.querySelector('.apx-burger'),nav=root.querySelector('.apx-nav');
 function set(open){nav.classList.toggle('is-open',open);btn.setAttribute('aria-expanded',String(open));btn.setAttribute('aria-label',open?'Close menu':'Open menu');}
 btn.addEventListener('click',function(){set(btn.getAttribute('aria-expanded')!=='true');});
 nav.addEventListener('click',function(e){if(e.target.closest('a'))set(false);});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&btn.getAttribute('aria-expanded')==='true'){set(false);btn.focus();}});
 document.addEventListener('click',function(e){if(!root.contains(e.target))set(false);});
 var p=location.pathname.replace(/index\.html$/,'');
 if(p.charAt(0)!=='/')p='/'+p;
 Array.prototype.forEach.call(root.querySelectorAll('.apx-nav a[data-match]'),function(a){
  var m=a.getAttribute('data-match');
  if(m==='/'?p==='/':p.indexOf(m)===0)a.setAttribute('aria-current','page');
 });
})();
</script>
